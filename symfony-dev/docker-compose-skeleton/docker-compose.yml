version: '3'

volumes:
  database:

services:
  web:
    image: weblabltd/symfony-dev:8.5
    volumes:
      - .:/var/www/html
    links:
      - mysql
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mysql:
    image: mysql:8-debian
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    volumes:
      - database:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: q1w2e3
      MYSQL_DATABASE: 4xfilms
      MYSQL_USER: 4xfilms
      MYSQL_PASSWORD: q1w2e3
